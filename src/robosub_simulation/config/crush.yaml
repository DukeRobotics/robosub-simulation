# Sensor, camera and thruster poses, camera specs and topics are read at launch from robosub-ros2:
# onboard/src/{static_transforms,controls,cv}/config/<robot>.yaml. The image holds the pinned commit at
# /opt/robosub-ros2; compose.robosub-ros2.yaml mounts a local checkout there instead. Only simulator
# physics and rates live here.
robot: crush
robosub_ros2: /opt/robosub-ros2
model: crush_model.yaml
water_density: 1000.0
quadratic_drag: [0.8, 0.8, 1.0]
viscous_drag: [0.005, 0.005, 0.005]
thruster:
  # Thrust at normalized allocation 1. ponytail: a symmetric T200 estimate at 16 V; the real PWM tables
  # stop short of full throttle and reverse is weaker. Measure and tune.
  max_force: 40.0
  max_omega: 150.0
  time_constant: 0.08
  watchdog: 0.4
# robosub-ros2 base_link in the CAD link frame (forward/right/down). Estimated from the centroid of
# the horizontal thrusters, which robosub-ros2 places symmetrically about base_link; confirm on the vehicle.
base_link: [-0.06233, 0.0, -0.0066]
# Simulated sensors and their robosub-ros2 static-transform frames. Rates (Hz) follow each real
# driver; the fiber-optic gyro runs at 1 kHz on hardware. The IMU frame, rate and covariances come
# from vectornav/config/vectornav.yaml.
sensors:
  gyro: {frame: gyro, rate: 100}
  pressure: {frame: pressure_sensor, rate: 20}
  dvl: {frame: dvl, rate: 10}
  # Ping360 head: a horizontal ray fan, one ray per gradian, sampled per angle during a sweep. Rays start
  # outside the hull; ponytail: rays are thin, so the 25 degree vertical beam (floor returns) is not modelled.
  sonar: {frame: sonar_ping_360, rate: 20, range: [0.45, 50.0]}
# Every usb_cameras entry in the cv config. ponytail: 5 Hz because software rendering is slow; raise it on a GPU host.
camera_rate: 5
teleop:
  linear_speed: 0.45
  angular_speed: 0.5
  gains: [20.0, 20.0, 25.0, 0.5, 0.8, 0.6]
  wrench_limits: [12.0, 12.0, 15.0, 0.5, 0.6, 0.6]
  command_timeout: 0.35
  odometry_timeout: 0.5

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pool · Duke Robotics</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/viewer.css">
    <script type="module" src="/viewer.js"></script>
  </head>
  <body>
    <a class="skip" href="#screen">Skip to simulation</a>
    <header>
      <div class="identity"><span class="mark" aria-hidden="true">DR</span><div><span class="eyebrow">DUKE ROBOTICS</span><h1>Pool simulation</h1></div></div>
      <div id="connection" role="status" aria-live="polite" data-state="connecting">Connecting</div>
      <nav aria-label="Simulation viewer">
        <button id="surface" disabled>Surface view <kbd>R</kbd></button>
        <button id="underwater" disabled>Underwater <kbd>U</kbd></button>
        <button id="reconnect">Reconnect</button>
        <button id="fullscreen">Fullscreen <span aria-hidden="true">⛶</span></button>
      </nav>
    </header>
    <main id="stage" aria-label="Interactive Stonefish simulation">
      <div id="screen" tabindex="0" aria-label="Pool viewport. Right drag to orbit, middle drag to pan, scroll to zoom."></div>
      <div id="notice">Starting the pool viewer…</div>
    </main>
    <footer>
      <span class="scene"><span aria-hidden="true">◈</span> POOL ENVIRONMENT <span class="separator">/</span> NED · METRES</span>
      <span class="help">Right drag <b>orbit</b><i>·</i> Middle drag <b>pan</b><i>·</i> Scroll <b>zoom</b><i>·</i> <kbd>H</kbd> inspector</span>
    </footer>
  </body>
</html>
